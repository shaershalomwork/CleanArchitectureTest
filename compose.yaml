name: keycloak-test-local

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/start-docker.ps1 first}
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
      # The API shares this network namespace so localhost means the same
      # Keycloak issuer in the browser and in JWT discovery inside Docker.
      - "127.0.0.1:7001:8081"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/fileshub-realm.json:/opt/keycloak/data/import/fileshub-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
    network_mode: service:keycloak
    depends_on:
      keycloak:
        condition: service_healthy
        restart: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8081
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/api.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${HTTPS_CERT_PASSWORD:?Run scripts/start-docker.ps1 first}
      Keycloak__Authority: http://localhost:8080/realms/fileshub
      Keycloak__Audience: keycloak-test-api
      Keycloak__ClientId: keycloak-test-scalar
      Keycloak__RequireHttpsMetadata: "false"
    volumes:
      - ./.local/https:/https:ro
    restart: unless-stopped

volumes:
  keycloak-data:
